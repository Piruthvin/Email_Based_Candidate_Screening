version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: talentpool-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-talentpool}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talentpool"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: talentpool-backend:v1
    container_name: talentpool-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # In container networking, connect to postgres service hostname
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/talentpool
      SCORING_AGENT_MODE: ${SCORING_AGENT_MODE:-fake}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
